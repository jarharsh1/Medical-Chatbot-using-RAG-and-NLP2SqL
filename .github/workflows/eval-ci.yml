name: Evaluation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  LLM_MODEL: qwen2.5:14b
  EMBED_MODEL: nomic-embed-text

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # qwen2.5:14b on CPU takes ~4-5 min per test x 50 tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Add swap space for qwen2.5:14b (~9GB model)
        run: |
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Memory after swap:"
          free -h

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 10
          ollama pull qwen2.5:14b
          ollama pull nomic-embed-text
          echo "Models ready:"
          ollama list

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate test data
        run: |
          python scripts/generate_data.py

      - name: Run database optimization (indexes + materialized views)
        run: |
          PYTHONPATH=. python backend/scripts/optimize_database.py

      - name: Run evaluation
        env:
          LLM_MODEL: qwen2.5:14b
        run: |
          python -m evaluation.evaluate

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evaluation/eval_report.json

      - name: Upload baseline metrics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-metrics
          path: evaluation/baseline_metrics.json
