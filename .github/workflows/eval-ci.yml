name: Evaluation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  LLM_MODEL: llama3.1:8b
  EMBED_MODEL: nomic-embed-text

jobs:
  evaluate:
    runs-on: self-hosted
    timeout-minutes: 180  # vectorstore build ~30min + 50 tests ~90min
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Ensure Ollama is running
        run: |
          # Start Ollama if not already running (no-op if already up)
          ollama list || (ollama serve &>/dev/null & sleep 5)
          echo "Models available:"
          ollama list

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate test data
        run: |
          python scripts/generate_data.py

      - name: Initialize database from CSV files
        run: |
          PYTHONPATH=. python scripts/init_db.py

      - name: Run database optimization (indexes + materialized views)
        run: |
          PYTHONPATH=. python backend/scripts/optimize_database.py

      - name: Copy ChromaDB index from local machine
        run: |
          CHROMA_SRC="C:/Users/Harsh Raj/OneDrive/Projects/Medical-Chatbot-using-RAG-and-NLP2SqL/backend/chroma_db"
          CHROMA_DST="backend/chroma_db"
          if [ -d "$CHROMA_SRC" ]; then
            echo "Copying existing ChromaDB from $CHROMA_SRC"
            cp -r "$CHROMA_SRC" "$CHROMA_DST"
            echo "Done."
          else
            echo "WARNING: No existing ChromaDB found, building from scratch (slow)"
            PYTHONPATH=. python scripts/build_vectorstore.py
          fi

      - name: Run evaluation
        env:
          LLM_MODEL: llama3.1:8b
        shell: powershell
        run: |
          # Run at BelowNormal priority so runner worker keeps sending heartbeats
          $proc = Start-Process python -ArgumentList "-m", "evaluation.evaluate" `
            -WorkingDirectory $PWD -PassThru -NoNewWindow `
            -RedirectStandardOutput "eval_stdout.txt" -RedirectStandardError "eval_stderr.txt"
          $proc.PriorityClass = [System.Diagnostics.ProcessPriorityClass]::BelowNormal
          $proc.WaitForExit()
          Get-Content eval_stdout.txt
          Get-Content eval_stderr.txt
          exit $proc.ExitCode

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evaluation/eval_report.json

      - name: Upload baseline metrics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-metrics
          path: evaluation/baseline_metrics.json
