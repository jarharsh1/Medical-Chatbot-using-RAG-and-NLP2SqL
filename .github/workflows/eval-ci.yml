name: Evaluation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  LLM_MODEL: llama3.1:8b
  EMBED_MODEL: nomic-embed-text

jobs:
  evaluate:
    runs-on: self-hosted
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Ensure Ollama is running
        run: |
          ollama list || (ollama serve &>/dev/null & sleep 5)
          echo "Models available:"
          ollama list

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Copy database and ChromaDB from local project
        run: |
          SRC="C:/Users/Harsh Raj/OneDrive/Projects/Medical-Chatbot-using-RAG-and-NLP2SqL/backend"
          # Copy SQLite DB (includes indexed_notes — prevents re-embedding)
          cp "$SRC/medical_records.db" backend/medical_records.db
          echo "Copied medical_records.db ($(du -sh backend/medical_records.db | cut -f1))"
          # Copy ChromaDB (pre-built embeddings)
          cp -r "$SRC/chroma_db" backend/chroma_db
          echo "Copied chroma_db ($(du -sh backend/chroma_db | cut -f1))"

      - name: Run database optimization (indexes + materialized views)
        run: |
          PYTHONPATH=. python backend/scripts/optimize_database.py

      - name: Run evaluation
        env:
          LLM_MODEL: llama3.1:8b
        shell: powershell
        run: |
          $proc = Start-Process python -ArgumentList "-m", "evaluation.evaluate" `
            -WorkingDirectory $PWD -PassThru -NoNewWindow `
            -RedirectStandardOutput "eval_stdout.txt" -RedirectStandardError "eval_stderr.txt"
          $proc.PriorityClass = [System.Diagnostics.ProcessPriorityClass]::BelowNormal
          $proc.WaitForExit()
          Get-Content eval_stdout.txt
          Get-Content eval_stderr.txt
          exit $proc.ExitCode

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evaluation/eval_report.json

      - name: Upload baseline metrics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-metrics
          path: evaluation/baseline_metrics.json
